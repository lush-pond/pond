:root{--pond-0:#0a2221;--pond-1:#0f3332;--pond-2:#16504d;--lily:#f6a9c2;--lily-deep:#c9748f;--ink:#f4efe6;--ink-soft:#b6cdc6;--line:rgba(244,239,230,.16);--glass:rgba(244,239,230,.07);--on-lily:#2a0f19;--bad:#ffb3c6;
  --hand:"Gochi Hand","Bradley Hand","Comic Sans MS",cursive;--ui:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 105%,var(--pond-2),transparent 65%),radial-gradient(80% 45% at 0% 0%,var(--pond-1),transparent 70%),var(--pond-0);color:var(--ink);font-family:var(--ui);display:grid;place-items:center;padding-inline:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.gate{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lily{width:150px;height:150px;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.lily.open{transform:scale(1.25) rotate(20deg)}
h1{font-family:var(--hand);font-weight:400;font-size:34px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
form{display:flex;flex-direction:column;gap:10px;width:100%}
input{height:56px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:400 24px var(--hand);text-align:center;outline:none}
input:focus{border-color:var(--lily);box-shadow:0 0 0 3px rgba(246,169,194,.25)}
button{height:56px;border:0;border-radius:999px;background:var(--lily);color:var(--on-lily);font:800 18px var(--ui);box-shadow:0 5px 0 var(--lily-deep);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lily-deep)}
button:disabled{opacity:.7}
.msg{min-height:24px;font-family:var(--hand);font-size:20px;color:var(--ink-soft)}
.msg.bad{color:var(--bad)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.lily{transition:none}.shake{animation:none}}
</style>

const KEY="lush-pond-key";
const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(ans){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(ans),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:un(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:un(P.i)},k,un(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
let p="";for(let i=0;i<10;i++)p+=`<ellipse cx="50" cy="31" rx="7" ry="20" fill="#f6a9c2" transform="rotate(${i*36} 50 50)"/>`;
for(let i=0;i<8;i++)p+=`<ellipse cx="50" cy="36" rx="6" ry="15" fill="#f9c0d2" transform="rotate(${i*45+22.5} 50 50)"/>`;
for(let i=0;i<6;i++)p+=`<ellipse cx="50" cy="41" rx="5" ry="10" fill="#fde0e9" transform="rotate(${i*60} 50 50)"/>`;
document.getElementById("lily").innerHTML=`<ellipse cx="50" cy="64" rx="49" ry="22" fill="#3d7a4c"/><path d="M50 64 L99 60 L99 68 Z" fill="#0a2221"/>${p}<circle cx="50" cy="50" r="6.5" fill="#ffd66b"/><circle cx="50" cy="50" r="3.2" fill="#f2b33d"/>`;
const gate=document.getElementById("gate"),f=document.getElementById("f"),a=document.getElementById("a"),b=document.getElementById("b"),m=document.getElementById("m");
function norm(s){return s.trim().toLowerCase().replace(/\s+/g," ");}
async function boot(){
  let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){try{show(await open(saved));return;}catch(e){try{localStorage.removeItem(KEY);}catch(_){}}}
  gate.hidden=false;
}
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const ans=norm(a.value);if(!ans){a.focus();return;}
  b.disabled=true;m.className="msg";m.textContent="";
